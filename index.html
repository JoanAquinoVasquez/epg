<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<!-- DEDICA:META -->
<title>Galaxia Simple - Agujero Negro, Día de las Flores Amarillas</title>
<meta name="description" content="Una galaxia sencilla con agujero negro, anillo dorado y fotos flotando entre frases del Día de las Flores Amarillas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<!-- DEDICA:PRELOAD -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  /* Sin esto, cualquier elemento con width/height:100% Y padding a la vez
     queda mas ancho/alto que el propio 100% (el padding se suma aparte con
     el box-sizing por defecto) - eso es lo que corria #start-screen 20px
     hacia la derecha (100% + 20px de padding a cada lado = 40px de sobra),
     desalineando el emoji y el texto de "Toca para iniciar" del centro real
     de la pantalla. */
  *{box-sizing:border-box;}
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  #main-title{
    position:fixed;top:40px;left:0;right:0;width:100%;
    font-size:2.6em;color:#FFFACD;white-space:nowrap;
    text-shadow:0 0 10px #FFD700,0 0 18px #FFA500;
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  @media (max-width:768px){
    #main-title{font-size:1.55em;top:22px;white-space:normal;padding:0 10px;line-height:1.15;}
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #start-heart{
    font-size:clamp(74px,23vmin,148px);line-height:1;display:block;
    filter:drop-shadow(0 0 14px rgba(255,215,0,.75)) drop-shadow(0 0 36px rgba(255,165,0,.38)) drop-shadow(0 0 66px rgba(218,165,32,.22));
    animation:latido 1.35s ease-in-out infinite;transform-origin:50% 55%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.15);}
    24%{transform:scale(1);}
    36%{transform:scale(1.07);}
    50%{transform:scale(1);}
  }
  #start-text{
    font-size:1.8em;color:#FFFACD;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #FFD700;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    #start-heart,#start-text{animation:none;}
  }

  /* ================= Controles Flotantes y Carta ================= */
  .ui-controls {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 max(20px, env(safe-area-inset-right, 20px)) 0 max(20px, env(safe-area-inset-left, 20px));
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .ui-controls.visible {
    opacity: 1;
    visibility: visible;
  }
  .btn-floating {
    pointer-events: auto;
    background: rgba(20, 16, 8, 0.78);
    color: #FFFACD;
    border: 1.5px solid rgba(255, 215, 0, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    box-shadow: 0 0 16px rgba(255, 215, 0, 0.28), 0 4px 12px rgba(0,0,0,0.5);
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .btn-floating:hover {
    transform: scale(1.06);
    background: rgba(35, 28, 12, 0.9);
    border-color: #FFD700;
    box-shadow: 0 0 24px rgba(255, 215, 0, 0.55), 0 6px 18px rgba(0,0,0,0.6);
  }
  .btn-floating:active {
    transform: scale(0.96);
  }
  #btn-letter {
    padding: 10px 20px;
    border-radius: 999px;
    gap: 10px;
    font-family: 'Indie Flower', 'Bradley Hand', cursive;
    font-size: 1.25em;
    animation: flotar-suave 3s ease-in-out infinite;
  }
  #btn-letter .btn-icon {
    font-size: 1.2em;
    display: inline-block;
    filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
  }
  @keyframes flotar-suave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .btn-music {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.3em;
  }
  .btn-music.playing #music-icon {
    display: inline-block;
    animation: disco-girar 4s linear infinite;
  }
  @keyframes disco-girar {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Modal de la Carta */
  .letter-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .letter-modal.open {
    opacity: 1;
    visibility: visible;
  }
  .letter-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .letter-card {
    position: relative;
    z-index: 10;
    max-width: 540px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    background: radial-gradient(circle at top, rgba(38, 30, 12, 0.95) 0%, rgba(16, 12, 5, 0.98) 100%);
    border: 2px solid rgba(255, 215, 0, 0.55);
    border-radius: 22px;
    padding: 36px 30px 30px;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 25px rgba(255, 215, 0, 0.08);
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 215, 0, 0.5) transparent;
  }
  .letter-modal.open .letter-card {
    transform: scale(1) translateY(0);
  }
  .letter-card::-webkit-scrollbar {
    width: 6px;
  }
  .letter-card::-webkit-scrollbar-thumb {
    background: rgba(255, 215, 0, 0.4);
    border-radius: 4px;
  }
  .btn-close-letter {
    position: absolute;
    top: 14px;
    right: 16px;
    background: transparent;
    border: none;
    color: #FFD700;
    font-size: 1.8em;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .btn-close-letter:hover {
    transform: scale(1.2);
    color: #FFF;
  }
  .letter-decoration {
    text-align: center;
    font-size: 1.5em;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
  }
  .letter-title {
    font-family: 'Indie Flower', cursive;
    font-size: 2.1em;
    color: #FFFACD;
    text-shadow: 0 0 12px #FFD700, 0 0 22px #FFA500;
    text-align: center;
    margin: 0 0 20px;
    line-height: 1.25;
  }
  .letter-body {
    color: #FFFDD0;
    font-family: 'Indie Flower', cursive;
    font-size: 1.35em;
    line-height: 1.6;
    text-shadow: 0 0 3px rgba(0,0,0,0.8);
  }
  .letter-body p {
    margin: 0 0 16px;
    text-indent: 14px;
  }
  .letter-body p:last-child {
    margin-bottom: 0;
  }
  .letter-footer {
    margin-top: 24px;
    text-align: right;
    font-family: 'Indie Flower', cursive;
    font-size: 1.35em;
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
  }
  @media (max-width: 600px) {
    #btn-letter {
      padding: 8px 16px;
      font-size: 1.1em;
    }
    .btn-music {
      width: 44px;
      height: 44px;
      font-size: 1.15em;
    }
    .letter-card {
      padding: 30px 20px 24px;
      max-height: 80vh;
    }
    .letter-title {
      font-size: 1.7em;
    }
    .letter-body {
      font-size: 1.2em;
    }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<h1 id="main-title"></h1>

<div id="start-screen">
  <div id="start-heart" aria-hidden="true">🌻</div>
  <div id="start-text">Toca para iniciar</div>
</div>

<!-- Controles flotantes inferiores -->
<div id="ui-controls" class="ui-controls">
  <button id="btn-letter" class="btn-floating" title="Abrir dedicatoria" aria-label="Abrir carta">
    <span class="btn-icon">💌</span>
    <span id="btn-letter-text">Abrir carta</span>
  </button>
  
  <button id="btn-music" class="btn-floating btn-music playing" title="Pausar / Reproducir música" aria-label="Control de música">
    <span id="music-icon">🎵</span>
  </button>
</div>

<!-- Modal de Carta Secreta / Dedicatoria -->
<div id="letter-modal" class="letter-modal" aria-hidden="true">
  <div class="letter-overlay" id="letter-overlay"></div>
  <div class="letter-card" id="letter-card" role="dialog" aria-modal="true" aria-labelledby="letter-title">
    <button id="btn-close-letter" class="btn-close-letter" aria-label="Cerrar carta">&times;</button>
    <div class="letter-decoration">🌻 ✨ 🌻</div>
    <h2 id="letter-title" class="letter-title"></h2>
    <div id="letter-body" class="letter-body"></div>
    <div id="letter-footer" class="letter-footer"></div>
  </div>
</div>

<audio id="audio" loop>
  <source src="assets/musica.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>

<!-- DEDICA:CONFIG -->

<script>
// ================= Título fijo + música (arranca recién al tocar) =================
document.getElementById('main-title').textContent=CONFIG.titulo;
const audio=document.getElementById('audio');
audio.querySelector('source').src=CONFIG.musica;
audio.load();

// ================= Escena =================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300,currentDist=300,rotX=0.2,rotY=0;

// Fondo: negro solido + el campo de estrellas generado abajo. La textura
// de nebulosa externa que traia el archivo original apuntaba a una URL de
// GitHub que ya no existe (404 - nunca se veia, ni siquiera antes de este
// cambio) - se quita en vez de dejar una dependencia externa rota.

// Estrellas
(function makeStars(count=2000,spread=3000){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=spread*(0.3+Math.random()*0.7);
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    pos[i*3+0]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// ================= Iluminación =================
const ambientLight=new THREE.AmbientLight(0xfff5d0,1.2);
scene.add(ambientLight);

const sunLight=new THREE.DirectionalLight(0xfffae6,2.0);
sunLight.position.set(280,180,220);
scene.add(sunLight);

const coreLight=new THREE.PointLight(0xffd700,2.5,450);
coreLight.position.set(0,0,0);
scene.add(coreLight);

// ================= Planeta Central Dorado =================
function makePlanetTexture(w=1024,h=512){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  
  // Base degradada atmosférica cálida
  const grd=ctx.createLinearGradient(0,0,0,h);
  grd.addColorStop(0.00,'#1c1003');
  grd.addColorStop(0.18,'#4a2806');
  grd.addColorStop(0.40,'#8a5209');
  grd.addColorStop(0.55,'#d4920e');
  grd.addColorStop(0.70,'#8a5209');
  grd.addColorStop(0.88,'#4a2806');
  grd.addColorStop(1.00,'#1c1003');
  ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);

  // Bandas jovianas y corrientes gaseosas doradas
  for(let y=0;y<h;y+=2){
    const ny=y/h;
    const wave=Math.sin(ny*Math.PI*16)+Math.sin(ny*Math.PI*32)*0.35;
    const alpha=0.12+0.16*Math.sin(ny*Math.PI*5);
    if(wave>0.3){
      ctx.fillStyle=`rgba(255,225,90,${alpha*1.6})`;
    }else if(wave<-0.25){
      ctx.fillStyle=`rgba(180,105,10,${alpha*1.4})`;
    }else{
      ctx.fillStyle=`rgba(255,245,185,${alpha*0.9})`;
    }
    ctx.fillRect(0,y,w,2);
  }

  // Vórtices y remolinos de nubes luminosas
  for(let i=0;i<70;i++){
    const cx=Math.random()*w;
    const cy=h*0.18+Math.random()*h*0.64;
    const rx=35+Math.random()*100;
    const ry=7+Math.random()*22;
    const rg=ctx.createRadialGradient(cx,cy,2,cx,cy,rx);
    rg.addColorStop(0,'rgba(255,240,160,0.5)');
    rg.addColorStop(0.5,'rgba(255,190,40,0.22)');
    rg.addColorStop(1,'rgba(255,140,0,0)');
    ctx.fillStyle=rg;
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.fill();
  }

  // Gran Vórtice Solar / Mancha Dorada
  const spotX=w*0.62,spotY=h*0.58;
  const spotGrad=ctx.createRadialGradient(spotX,spotY,4,spotX,spotY,75);
  spotGrad.addColorStop(0,'rgba(255,255,235,0.9)');
  spotGrad.addColorStop(0.35,'rgba(255,215,0,0.65)');
  spotGrad.addColorStop(0.75,'rgba(218,140,10,0.3)');
  spotGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=spotGrad;
  ctx.beginPath();ctx.ellipse(spotX,spotY,80,40,-0.12,0,Math.PI*2);ctx.fill();

  // Destellos estelares en la superficie
  for(let i=0;i<240;i++){
    const px=Math.random()*w,py=Math.random()*h,pr=Math.random()*1.8;
    ctx.fillStyle=Math.random()>0.45?'rgba(255,255,255,0.65)':'rgba(255,220,50,0.75)';
    ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
  }

  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=THREE.RepeatWrapping;
  tex.wrapT=THREE.ClampToEdgeWrapping;
  return tex;
}

function makePlanetBump(w=512,h=256){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#808080';ctx.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=4){
    const wave=Math.sin(y/h*Math.PI*16)*35;
    ctx.fillStyle=`rgb(${128+wave},${128+wave},${128+wave})`;
    ctx.fillRect(0,y,w,4);
  }
  for(let i=0;i<45;i++){
    const cx=Math.random()*w,cy=Math.random()*h,r=12+Math.random()*32;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'#ffffff');g.addColorStop(1,'#808080');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

const planetTex=makePlanetTexture();
const planetBump=makePlanetBump();
const coreMat=new THREE.MeshStandardMaterial({
  map:planetTex,
  bumpMap:planetBump,
  bumpScale:1.6,
  roughness:0.38,
  metalness:0.28,
  emissive:0x4a2a00,
  emissiveMap:planetTex,
  emissiveIntensity:0.55
});
const core=new THREE.Mesh(new THREE.SphereGeometry(40,64,64),coreMat);
scene.add(core);

// Atmósfera de resplandor luminiscente (Fresnel rim glow)
const atmoMat=new THREE.ShaderMaterial({
  vertexShader:`
    varying vec3 vNormal;
    void main(){
      vNormal=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    varying vec3 vNormal;
    void main(){
      float intensity=pow(0.66-dot(vNormal,vec3(0,0,1.0)),2.2);
      gl_FragColor=vec4(1.0,0.88,0.40,1.0)*intensity*1.8;
    }
  `,
  blending:THREE.AdditiveBlending,
  side:THREE.BackSide,
  transparent:true,
  depthWrite:false
});
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(42.5,64,64),atmoMat);
scene.add(atmosphere);

// El título ahora vive en la cabecera fija (#main-title, ver DEDICA:CONFIG
// mas arriba) en vez de un sprite 3D en el centro - mas legible y
// consistente con el resto del catalogo.

// Glow exterior (reducido, para que el anillo se note más)
const GLOW_BASE=360;
function makeGlow(size=768,c1='255,235,130',c2='255,180,0'){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0,'rgba('+c1+',0.55)');
  grad.addColorStop(0.5,'rgba('+c2+',0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.scale.set(GLOW_BASE,GLOW_BASE,1);
scene.add(glow);

// Anillo único (antes eran 3 anillos separados con huecos reales entre
// ellos). Sigue siendo un solo disco continuo (42-116, sin huecos), pero
// ahora con textura de franjas finas superpuestas al degradado de base -
// como los anillos de Saturno, que se ven "en capas" por dentro sin
// separarse en piezas distintas.
function ringTexture(size=1024){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const rInner=size*0.205,rOuter=size*0.49;
  // Base: un solo degradado continuo de borde a borde, sin apagarse hacia
  // el borde exterior, para que el anillo se vea denso y solido.
  const grd=g.createRadialGradient(0,0,rInner,0,0,rOuter);
  grd.addColorStop(0.00,'rgba(255,255,245,1)');
  grd.addColorStop(0.30,'rgba(255,235,120,1)');
  grd.addColorStop(0.65,'rgba(255,200,40,0.95)');
  grd.addColorStop(1.00,'rgba(255,160,0,0.85)');
  g.fillStyle=grd;
  g.beginPath();g.arc(0,0,rOuter,0,Math.PI*2);g.arc(0,0,rInner,0,Math.PI*2,true);g.closePath();g.fill();

  // Franjas concentricas finas por encima del degradado base - varian el
  // brillo (mas claras u oscuras), nunca la opacidad hasta 0, asi que no
  // dejan huecos ni se leen como anillos separados, solo como textura.
  const bandCount=26;
  for(let i=0;i<bandCount;i++){
    const r=rInner+(rOuter-rInner)*(i/(bandCount-1));
    const dark=i%3===0;
    g.beginPath();
    g.arc(0,0,r,0,Math.PI*2);
    g.lineWidth=(rOuter-rInner)/bandCount*(0.55+Math.random()*0.35);
    g.strokeStyle=dark?'rgba(110,60,0,0.20)':'rgba(255,255,225,0.16)';
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const ring=new THREE.Mesh(new THREE.RingGeometry(42,116,160),new THREE.MeshBasicMaterial({map:ringTexture(),transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:1}));
ring.rotation.x=Math.PI/2;
scene.add(ring);

// Palabras alrededor: frases del Día de las Flores Amarillas (min 1, se repiten
// ciclicamente hasta llenar las 150 posiciones que la escena ya reserva,
// sin importar cuántas haya dejado el cliente - ver schema.json).
const frasesBase=(Array.isArray(CONFIG.frases)&&CONFIG.frases.length)?CONFIG.frases:DEFAULTS.frases;
const WORD_SLOTS=150;
const WORDS=Array.from({length:WORD_SLOTS},(_,i)=>frasesBase[i%frasesBase.length]);
function makeTextTexture(text,color){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=30;
  // Antes el tamaño de fuente era fijo (60px) sin importar el largo de la
  // frase - una frase larga (con emoji, que ya de por si ocupa bastante
  // ancho) se salia del lienzo de 512px y quedaba cortada a la mitad. Ahora
  // el tamaño se reduce hasta que la frase completa entra, con un piso de
  // 24px para que no se vuelva ilegible.
  const maxWidth=c.width-48;
  let fontSize=60;
  ctx.font=fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width>maxWidth&&fontSize>24){
    fontSize-=2;
    ctx.font=fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text,c.width/2,c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS=['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#e6b800','#ffdb58','#f0c419'];
const textGroup=new THREE.Group();scene.add(textGroup);
// Se espera a que 'Indie Flower' termine de cargar antes de dibujar las
// frases en canvas - a diferencia del texto normal del DOM (el navegador ya
// resuelve el "parpadeo" de fuente por su cuenta), un canvas dibuja con la
// fuente que este disponible EN ESE INSTANTE: sin esto, las 150 frases
// quedaban grabadas para siempre con la tipografia de respaldo (Arial) si
// la fuente todavia no habia terminado de bajar en el momento exacto en que
// corria este bucle.
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const tex=makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    const sp=new THREE.Sprite(mat);
    sp.scale.set(68,21.8,1);
    const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
    const r=150+Math.random()*120;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
    sp.userData={phi:phi,theta:theta,radius:r,speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

// Fotos del cliente flotando de forma individual (reemplazan a los emojis de
// la version original). Minimo 1, maximo 3 (plantilla gratuita, ver
// schema.json) - se reparten ciclicamente (i % cantidad) entre las 26
// posiciones fijas que la escena ya reserva, igual que antes hacian los
// emojis, asi que menos fotos simplemente se repiten mas seguido sin que la
// escena se vea mas vacia.
const fotosBase=(Array.isArray(CONFIG.fotos)&&CONFIG.fotos.length)?CONFIG.fotos:DEFAULTS.fotos;
function makePhotoSprite(url,size){
  const c=document.createElement('canvas');c.width=c.height=256;
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(size,size,1);
  const img=new Image();
  if(url.startsWith('http://')||url.startsWith('https://')){img.crossOrigin='anonymous';}
  img.onload=()=>{
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    // "contain": la foto entra completa sin recortar ningun borde (lo que
    // sobra en el lienzo cuadrado queda transparente); el sprite se encoge
    // en el eje sobrante para que no se note como un marco cuadrado vacio.
    const s=Math.min(c.width/img.width,c.height/img.height);
    ctx.drawImage(img,(c.width-img.width*s)/2,(c.height-img.height*s)/2,img.width*s,img.height*s);
    tex.needsUpdate=true;
    const aspect=img.naturalWidth/img.naturalHeight;
    const aX=Math.min(1,aspect),aY=Math.min(1,1/aspect);
    sp.scale.set(size*aX,size*aY,1);
  };
  img.onerror=()=>{};
  img.src=url;
  return sp;
}
const photoGroup=new THREE.Group();scene.add(photoGroup);
const PHOTO_COUNT=26;
for(let i=0;i<PHOTO_COUNT;i++){
  const url=fotosBase[i%fotosBase.length];
  const size=28+Math.random()*20;
  const sp=makePhotoSprite(url,size);
  const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
  const r=140+Math.random()*170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
  sp.userData={phi:phi,theta:theta,radius:r,speed:0.0006+Math.random()*0.0012};
  photoGroup.add(sp);
}

// Controles cámara — dirección corregida: ahora sigue el lado hacia donde deslizas
let dragging=false,lastX=0,lastY=0;
function onDown(e){dragging=true;const t=e.touches?e.touches[0]:e;lastX=t.clientX;lastY=t.clientY;}
function onMove(e){if(!dragging)return;const t=e.touches?e.touches[0]:e;const dx=(t.clientX-lastX)/innerWidth;const dy=(t.clientY-lastY)/innerHeight;rotY-=dx*5;rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*3.5));lastX=t.clientX;lastY=t.clientY;}
function onUp(){dragging=false;}
addEventListener('mousedown',onDown);addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
addEventListener('touchstart',onDown,{passive:true});addEventListener('touchmove',onMove,{passive:true});addEventListener('touchend',onUp,{passive:true});
addEventListener('wheel',(e)=>{targetDist+=e.deltaY*0.25;targetDist=Math.max(160,Math.min(600,targetDist));},{passive:true});

// Zoom con pellizco en móviles
let pinch=0;
addEventListener('touchmove',(e)=>{
  if(e.touches && e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    if(pinch){targetDist+=(pinch-d)*0.5;targetDist=Math.max(160,Math.min(600,targetDist));}
    pinch=d;
  }
},{passive:false});
addEventListener('touchend',()=>{pinch=0;},{passive:true});

// Animación
let t=0;
function tick(){requestAnimationFrame(tick);t+=0.01;
  ring.rotation.z+=0.003;
  glow.scale.set(GLOW_BASE*(1+Math.sin(t*0.4)*0.03),GLOW_BASE*(1+Math.sin(t*0.4)*0.03),1);
  const s=1.0+0.025*Math.sin(t*2.4); // respiración suave
  core.scale.set(s,s,s);
  core.rotation.y+=0.0022; // rotación del planeta sobre su eje
  if(typeof atmosphere!=='undefined'){
    atmosphere.scale.set(s,s,s);
    atmosphere.rotation.y+=0.003; // rotación atmosférica
  }
  textGroup.children.forEach(sp=>{
    sp.material.opacity=0.8+0.2*Math.sin(t*2);
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach(sp=>{
    sp.material.opacity=0.85+0.15*Math.sin(t*2+sp.userData.radius);
    // Sin rotacion propia: a diferencia de un emoji (simetrico, giraba bien
    // como si fuera un pinwheel), una foto real con forma reconocible se ve
    // rara/como "estirada" al girar sobre su propio eje en ciertos angulos -
    // se quita, la foto solo orbita y flota, se queda siempre derecha.
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  currentDist+=(targetDist-currentDist)*0.06;
  const cx=Math.cos(rotX),sx=Math.sin(rotX);const cy=Math.cos(rotY),sy=Math.sin(rotY);
  camera.position.set(currentDist*sy*cx,currentDist*sx,currentDist*cy*cx);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();

// ── Arranque: la musica recien empieza cuando se toca la pantalla ──
const startScreen=document.getElementById('start-screen');
const uiControls=document.getElementById('ui-controls');
function startExperience(){
  startScreen.classList.add('hidden');
  setTimeout(()=>{
    startScreen.style.display='none';
    if(uiControls) uiControls.classList.add('visible');
  },600);
  audio.play().catch(()=>{});
}
startScreen.addEventListener('click',startExperience);

// ================= Control de Música =================
const btnMusic=document.getElementById('btn-music');
const musicIcon=document.getElementById('music-icon');
function updateAudioUI(isPlaying){
  if(isPlaying){
    btnMusic.classList.add('playing');
    musicIcon.textContent='🎵';
    btnMusic.setAttribute('title','Pausar música');
  }else{
    btnMusic.classList.remove('playing');
    musicIcon.textContent='🔇';
    btnMusic.setAttribute('title','Reproducir música');
  }
}
btnMusic.addEventListener('click',(e)=>{
  e.stopPropagation();
  if(audio.paused){
    audio.play().catch(()=>{});
  }else{
    audio.pause();
  }
});
audio.addEventListener('play',()=>updateAudioUI(true));
audio.addEventListener('pause',()=>updateAudioUI(false));

// ================= Modal de Carta Secreta =================
const btnLetter=document.getElementById('btn-letter');
const btnLetterText=document.getElementById('btn-letter-text');
const letterModal=document.getElementById('letter-modal');
const letterCard=document.getElementById('letter-card');
const letterOverlay=document.getElementById('letter-overlay');
const btnCloseLetter=document.getElementById('btn-close-letter');
const letterTitle=document.getElementById('letter-title');
const letterBody=document.getElementById('letter-body');
const letterFooter=document.getElementById('letter-footer');

const cartaConfig=CONFIG.carta||DEFAULTS.carta;
if(cartaConfig){
  if(cartaConfig.boton&&btnLetterText) btnLetterText.textContent=cartaConfig.boton;
  if(letterTitle) letterTitle.textContent=cartaConfig.titulo||'';
  if(letterFooter) letterFooter.innerHTML=(cartaConfig.firma||'').replace(/\n/g,'<br>');
  if(letterBody){
    if(Array.isArray(cartaConfig.parrafos)){
      letterBody.innerHTML=cartaConfig.parrafos.map(p=>`<p>${p}</p>`).join('');
    }else if(typeof cartaConfig.parrafos==='string'){
      letterBody.innerHTML=`<p>${cartaConfig.parrafos}</p>`;
    }
  }
}

function openLetter(e){
  if(e) e.stopPropagation();
  letterModal.classList.add('open');
  letterModal.setAttribute('aria-hidden','false');
}

function closeLetter(e){
  if(e) e.stopPropagation();
  letterModal.classList.remove('open');
  letterModal.setAttribute('aria-hidden','true');
}

btnLetter.addEventListener('click',openLetter);
btnCloseLetter.addEventListener('click',closeLetter);
letterOverlay.addEventListener('click',closeLetter);

// Evitar que interactuar con la carta mueva la cámara 3D
['mousedown','mousemove','mouseup','touchstart','touchmove','touchend','wheel'].forEach(evName=>{
  letterCard.addEventListener(evName,(e)=>e.stopPropagation(),{passive:evName==='wheel'});
  btnLetter.addEventListener(evName,(e)=>e.stopPropagation(),{passive:true});
  btnMusic.addEventListener(evName,(e)=>e.stopPropagation(),{passive:true});
});

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'&&letterModal.classList.contains('open')){
    closeLetter();
  }
});
</script>
